; ESP32-2432S028 ("Cheap Yellow Display") as a USB display for a Raspberry Pi.
;
;   pio run -t upload              -> standard board (ILI9341, one micro-USB port)
;   pio run -e cyd2usb -t upload   -> "2 USB" variant (ST7789, micro-USB + USB-C)

[platformio]
default_envs = cyd

[env]
platform = espressif32@^6
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 921600
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bitbank2/JPEGDEC@^1.4.2
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Must match --baud on the Pi side.
    -DLINK_BAUD=921600
    ; TFT_eSPI is configured here instead of editing its User_Setup.h.
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1

[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1

[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
